<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acolhe+ | Chat</title>
  <link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/disciplinas.css">
<link rel="stylesheet" href="/css/notificacoes.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteudo principal</a>
<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Conversas">
<div class="sidebar-header">
<a href="#" class="logo-container" id="topbar-logo" title="Pagina inicial">
  				<div class="logo-icon">A+</div>
  				<h1 class="logo-title">Acolhe+</h1>
  			</a>
            <button class="btn-new-chat" id="btn-new-chat" title="Nova conversa">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span>Nova Conversa</span>
            </button>
        </div>

      <div class="conversations-list" id="conversations-list">
        </div>

        <div class="sidebar-footer">
            <div class="user-info-small">
                <div class="user-avatar-small" id="user-avatar-small">??</div>
                <div class="user-details-small">
                    <span class="user-name-small" id="user-name-small">Carregando...</span>
                    <span class="user-role-small" id="user-role-small">-</span>
                </div>
            </div>
            <button class="btn-logout" id="btn-logout">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Sair</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content" role="main">
        <!-- Chat View -->
        <div id="view-chat">
            <header class="chat-header" role="banner">
                <button class="btn-menu-mobile" id="btn-menu-mobile" aria-label="Abrir menu">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
      <h2 class="chat-title" id="chat-title">Nova Conversa</h2>
<div class="header-actions">
        <a href="/disciplinas" class="btn-nav" id="nav-disciplinas" title="Minhas Disciplinas">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </a>
        <a href="/portal" class="btn-nav" id="nav-portal" title="Meu Perfil">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </a>
        <a href="/painel" class="btn-nav" id="nav-painel" title="Painel NAPNE" style="display:none">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </a>
        <div class="notificacao-bell-container"></div>
        <button class="btn-nav" id="btn-aluno-context" title="Vincular aluno a conversa" aria-label="Vincular aluno a conversa">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </div>
    </header>

    <!-- Aluno Context Bar -->
    <div class="aluno-context-bar" id="aluno-context-bar" hidden>
      <div class="aluno-badge" id="aluno-badge" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="aluno-badge-name"></span>
                <button class="aluno-badge-remove" id="btn-remove-aluno" title="Remover contexto de aluno" aria-label="Remover contexto de aluno">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="aluno-search-wrapper" id="aluno-search-wrapper" hidden>
        <input type="text" id="aluno-search-input" placeholder="Buscar aluno por nome ou matrícula..." autocomplete="off">
        <button class="aluno-search-close" id="btn-close-aluno-search" title="Fechar busca" aria-label="Fechar busca">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="aluno-search-results" id="aluno-search-results" hidden></div>
      </div>
    </div>

            <div class="messages-container" id="messages-container" aria-live="polite" aria-label="Mensagens do chat">
                <div class="messages-wrapper" id="messages-wrapper">
                    <div class="empty-state" id="empty-state">
                        <div class="empty-state-icon">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                        </div>
                        <h3>Como posso te ajudar hoje?</h3>
                        <p>Envie uma mensagem para comecar a conversa</p>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Digite sua mensagem..." rows="1" maxlength="4000"></textarea>
                    <button class="btn-send" id="btn-send" disabled aria-label="Enviar mensagem">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">O Acolhe+ pode cometer erros. Verifique informacoes importantes.</p>
            </div>
  </div>
</main>
</div>

  <script src="/js/js.cookie.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/client.js"></script>
<script src="/js/chat.store.js"></script>
<script src="/js/chat.service.js"></script>
  <script src="/js/chat.ui.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/notificacao.js"></script>
<script>
(function() { if (typeof NotificacaoService !== 'undefined') NotificacaoService.init(); })();
</script>
</body>
</html>
