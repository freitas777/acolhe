<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){document.documentElement.removeAttribute("data-theme");document.documentElement.removeAttribute("data-contrast");localStorage.removeItem("acolhe-theme");localStorage.removeItem("acolhe-contrast");localStorage.removeItem("acolhe-font-size")})()</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acolhe+ | Conversas</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/conversas.css">
  <link rel="stylesheet" href="/css/notificacoes.css">
  <link rel="stylesheet" href="/css/acessibilidade.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteudo principal</a>
<header class="topbar" role="banner">
  <div class="topbar-left">
    <a href="/disciplinas" class="topbar-logo" id="topbar-logo" title="Minhas disciplinas">
      <div class="logo-icon">A+</div>
      <span class="logo-text">Acolhe+</span>
    </a>
  </div>
  <div class="topbar-center">
    <h1 class="page-title">Conversas</h1>
  </div>
  <div class="topbar-right">
    <div class="notificacao-bell-container"></div>
    <a href="/portal" class="btn-nav" title="Meu Perfil" id="nav-portal">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </a>
    <div class="user-pill" id="user-pill">
      <div class="user-avatar" id="user-avatar">??</div>
      <span class="user-name" id="user-name">Carregando...</span>
    </div>
    <button class="btn-logout" id="btn-logout" title="Sair">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</header>

<main class="conversas-page" id="main-content" role="main">
  <div class="conversas-header">
    <h2>Escolha uma materia</h2>
    <p>Selecione uma materia abaixo para ver as conversas dela ou iniciar uma nova.</p>
  </div>
  <div class="conversas-grid" id="conversas-grid">
    <div class="conversas-empty" id="conversas-empty">
      <div class="spinner"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="alert" hidden>
  <span id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

  <script src="/js/js.cookie.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/client.js"></script>
  <script src="/js/conversas.js"></script>
<script src="/js/notificacao.js"></script>
<script src="/js/acessibilidade.js"></script>
<script>
(function() { if (typeof NotificacaoService !== 'undefined') NotificacaoService.init(); })();
</script>
</body>
</html>
