<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acolhe+ | Minhas Disciplinas</title>
  <link rel="stylesheet" href="/css/disciplinas-page.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
<div class="topbar-left">
			<a href="/dashboard" class="topbar-logo" title="Ir para o Chat">
				<div class="logo-icon">A+</div>
				<span class="logo-text">Acolhe+</span>
			</a>
		</div>
		<div class="topbar-center">
			<h1 class="page-title">Minhas Disciplinas</h1>
		</div>
    <div class="topbar-right">
      <div class="user-pill" id="user-pill">
        <div class="user-avatar" id="user-avatar">??</div>
        <span class="user-name" id="user-name">Carregando...</span>
      </div>
      <button class="btn-sync" id="btn-sync" title="Sincronizar disciplinas do SUAP">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span class="btn-sync-text">Sincronizar</span>
      </button>
      <button class="btn-logout" id="btn-logout" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="disciplinas-page">
    <div class="semestre-badge" id="semestre-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span id="semestre-text">2026.1</span>
    </div>

    <div class="disciplinas-grid" id="disciplinas-grid">
      <div class="disciplinas-empty" id="disciplinas-empty">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <h3>Carregando disciplinas...</h3>
        <p>Buscando suas disciplinas no SUAP</p>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="alert" hidden>
    <span id="toast-icon"></span>
    <span id="toast-message"></span>
  </div>

  <script src="/js/js.cookie.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/client.js"></script>
  <script src="/js/disciplinas.js"></script>
</body>
</html>
