<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acolhe+ | Minhas Disciplinas</title>
  <link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/disciplinas-page.css">
    <link rel="stylesheet" href="/css/notificacoes.css">
<link rel="stylesheet" href="/css/disciplinas.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteudo principal</a>
<header class="topbar" role="banner">
<div class="topbar-left">
        <a href="#" class="topbar-logo" id="topbar-logo" title="Pagina inicial">
				<div class="logo-icon">A+</div>
				<span class="logo-text">Acolhe+</span>
			</a>
		</div>
		<div class="topbar-center">
			<h1 class="page-title">Minhas Disciplinas</h1>
		</div>
<div class="topbar-right">
<div class="notificacao-bell-container"></div>
<a href="/portal" class="btn-nav" title="Meu Perfil" id="nav-portal-disciplinas">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  </svg>
</a>
<a href="/chat" class="btn-nav" title="Chat">
<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
</svg>
</a>
<a href="/portal" class="btn-nav" title="Meu Perfil" id="nav-portal">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
            <div class="user-pill" id="user-pill">
        <div class="user-avatar" id="user-avatar">??</div>
        <span class="user-name" id="user-name">Carregando...</span>
      </div>
      <button class="btn-sync" id="btn-sync" title="Sincronizar disciplinas do SUAP">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span class="btn-sync-text">Sincronizar</span>
      </button>
      <button class="btn-logout" id="btn-logout" title="Sair">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="disciplinas-page" id="main-content" role="main">
    <div class="semestre-badge" id="semestre-badge">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span id="semestre-text">2026.1</span>
    </div>

    <div class="disciplinas-grid" id="disciplinas-grid">
      <div class="disciplinas-empty" id="disciplinas-empty">
        <div class="empty-state-icon">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <h3>Carregando disciplinas...</h3>
        <p>Buscando suas disciplinas no SUAP</p>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="student-modal" role="dialog" aria-modal="true" aria-labelledby="modal-student-title" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-student-title">Aluno</h2>
        <button class="modal-close" id="student-modal-close" title="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <div class="portal-tabs" id="student-modal-tabs">
          <button class="portal-tab active" data-tab="perfil">Perfil</button>
          <button class="portal-tab" data-tab="conteudos">Conteúdos</button>
          <button class="portal-tab" data-tab="apoio">Solicitar Apoio</button>
          <button class="portal-tab" data-tab="observacao">Observação</button>
        </div>
        <section class="modal-section" id="modal-perfil"></section>
        <section class="modal-section" id="modal-conteudos" hidden></section>
        <section class="modal-section" id="modal-apoio" hidden></section>
        <section class="modal-section" id="modal-observacao" hidden></section>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="materiais-modal" role="dialog" aria-modal="true" aria-labelledby="modal-materiais-title" hidden>
    <div class="modal modal-large">
      <div class="modal-header">
        <h2 id="modal-materiais-title">Materiais da Disciplina</h2>
        <button class="modal-close" id="materiais-modal-close" title="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <div class="materiais-info" id="materiais-info"></div>
        <div class="materiais-upload-section" id="materiais-upload-section" hidden>
          <div class="upload-area" id="upload-area">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;margin-bottom:12px">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p class="upload-text">Arraste arquivos aqui ou clique para selecionar</p>
            <p class="upload-hint">PDF, DOC, DOCX, PPT, PPTX, PNG, JPG, TXT (máx. 10MB)</p>
            <input type="file" id="file-input" hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.txt">
            <button class="btn-upload" id="btn-select-file">Selecionar Arquivo</button>
          </div>
          <div class="upload-progress" id="upload-progress" hidden>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-text" id="progress-text">Enviando...</span>
          </div>
        </div>
        <div class="materiais-list" id="materiais-list">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" hidden>
    <span id="toast-icon"></span>
    <span id="toast-message"></span>
  </div>

  <script src="/js/js.cookie.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/client.js"></script>
  <script src="/js/disciplinas.js"></script>
<script src="/js/notificacao.js"></script>
<script>
(function() { if (typeof NotificacaoService !== 'undefined') NotificacaoService.init(); })();
</script>
</body>
</html>
