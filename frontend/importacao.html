<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){document.documentElement.removeAttribute("data-theme");document.documentElement.removeAttribute("data-contrast");localStorage.removeItem("acolhe-theme");localStorage.removeItem("acolhe-contrast");localStorage.removeItem("acolhe-font-size")})()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acolhe+ | Cadastrar Aluno</title>
    <link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/importacao.css">
    <link rel="stylesheet" href="/css/notificacoes.css">
    <link rel="stylesheet" href="/css/acessibilidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<a href="#main-content" class="skip-link">Pular para o conteudo principal</a>
<header class="topbar" role="banner">
<div class="topbar-left">
        <a href="#" class="topbar-logo" id="topbar-logo" title="Pagina inicial">
				<div class="logo-icon">A+</div>
				<span class="logo-text">Acolhe+</span>
			</a>
		</div>
		<div class="topbar-center">
			<h1 class="page-title">Cadastrar Aluno</h1>
		</div>
        <div class="topbar-right">
<div class="notificacao-bell-container"></div>
<a href="/chat" class="btn-nav" title="Chat">
<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
</svg>
</a>
<div class="user-pill" id="user-pill">
                <div class="user-avatar" id="user-avatar">??</div>
                <span class="user-name" id="user-name">Carregando...</span>
            </div>
            <button class="btn-logout" id="btn-logout" title="Sair">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

<main class="importacao-page" id="main-content" role="main">
		<a href="/painel" class="btn-back-fixed" title="Voltar ao Painel NAPNE">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
    </svg>
</a>
		<div class="importacao-header">
            <div class="importacao-desc">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="header-icon">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
                <div>
                    <h2>Cadastro de Aluno</h2>
                    <p>Cadastre um aluno diretamente informando os dados abaixo.</p>
                </div>
            </div>
        </div>

        <div class="manual-section">
            <div class="manual-card">
                <div class="manual-header">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="manual-icon">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    <div>
                        <h3>Cadastro Manual</h3>
                        <p>Cadastre um aluno diretamente informando os dados abaixo.</p>
                    </div>
                </div>
                <form id="manual-form" class="manual-form" autocomplete="off">
                    <div class="form-row">
                        <div class="form-group form-group-full">
                            <label for="manual-nome">Nome completo <span class="required">*</span></label>
                            <input type="text" id="manual-nome" class="form-input" placeholder="Nome do aluno" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="manual-matricula">Matr&iacute;cula <span class="required">*</span></label>
                            <input type="text" id="manual-matricula" class="form-input" placeholder="N&uacute;mero da matr&iacute;cula" required>
                        </div>
                        <div class="form-group">
                            <label for="manual-curso">Curso</label>
                            <input type="text" id="manual-curso" class="form-input" placeholder="Nome do curso">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="manual-campus">Campus</label>
                            <input type="text" id="manual-campus" class="form-input" placeholder="Campus">
                        </div>
                        <div class="form-group">
                            <label for="manual-email">Email</label>
                            <input type="email" id="manual-email" class="form-input" placeholder="email@exemplo.com">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-manual-submit" id="btn-manual-submit">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="8.5" cy="7" r="4"/>
                                <line x1="20" y1="8" x2="20" y2="14"/>
                                <line x1="23" y1="11" x2="17" y2="11"/>
                            </svg>
                            Cadastrar Aluno
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div class="toast" id="toast" role="alert" hidden>
        <span id="toast-icon"></span>
        <span id="toast-message"></span>
    </div>

    <script src="/js/js.cookie.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/client.js"></script>
    <script src="/js/importacao.js"></script>
<script src="/js/notificacao.js"></script>
<script src="/js/acessibilidade.js"></script>
<script>
(function() { if (typeof NotificacaoService !== 'undefined') NotificacaoService.init(); })();
</script>
</body>
</html>
