<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acolhe+ | Painel NAPNE</title>
    <link rel="stylesheet" href="/css/painel.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
<div class="topbar-left">
			<a href="/dashboard" class="topbar-logo" title="Ir para o Chat">
				<div class="logo-icon">A+</div>
				<span class="logo-text">Acolhe+</span>
			</a>
		</div>
		<div class="topbar-center">
			<h1 class="page-title">Painel NAPNE</h1>
		</div>
        <div class="topbar-right">
            <div class="user-pill" id="user-pill">
                <div class="user-avatar" id="user-avatar">??</div>
                <span class="user-name" id="user-name">Carregando...</span>
            </div>
            <button class="btn-logout" id="btn-logout" title="Sair">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="painel-page">
        <div class="painel-nav">
            <a href="/importacao" class="nav-link nav-importacao" title="Importar alunos do SUAP">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Importar Alunos do SUAP</span>
            </a>
        </div>

        <div class="painel-section">
            <div class="search-bar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Buscar aluno por nome ou matricula...">
            </div>
            <div class="search-results" id="search-results" hidden></div>
        </div>

        <div class="painel-columns">
            <div class="painel-column">
                <div class="column-header column-pendencias">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <h2>Pendencias de Validacao</h2>
                    <span class="badge" id="pendencias-count">0</span>
                </div>
                <div class="column-body" id="pendencias-list">
                    <div class="empty-col"><p>Carregando...</p></div>
                </div>
            </div>

            <div class="painel-column">
                <div class="column-header column-ativos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <h2>Alunos Ativos</h2>
                    <span class="badge badge-green" id="ativos-count">0</span>
                </div>
                <div class="column-body" id="ativos-list">
                    <div class="empty-col"><p>Carregando...</p></div>
                </div>
            </div>
        </div>
    </main>

<div class="modal-overlay" id="profile-modal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-aluno-name">Perfil do Aluno</h2>
      <button class="modal-close" id="modal-close" title="Fechar">&times;</button>
    </div>
    <form id="profile-form" class="modal-body">
      <input type="hidden" id="profile-aluno-id">

      <div class="form-group">
        <label for="profile-nivel-atencao">Nivel de Atencao</label>
        <select id="profile-nivel-atencao">
          <option value="">-- Nenhum --</option>
          <option value="alto">Alto</option>
          <option value="medio">Medio</option>
          <option value="baixo">Baixo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="profile-dificuldade-leitura">Dificuldade de Leitura</label>
        <select id="profile-dificuldade-leitura">
          <option value="false">Nao</option>
          <option value="true">Sim</option>
        </select>
      </div>

      <div class="form-group">
        <label for="profile-preferencia">Preferencia de Aprendizado</label>
        <select id="profile-preferencia">
          <option value="">-- Nenhum --</option>
          <option value="visual">Visual</option>
          <option value="auditivo">Auditivo</option>
          <option value="cinestesico">Cinestesico</option>
          <option value="leitura_escrita">Leitura/Escrita</option>
          <option value="misto">Misto</option>
        </select>
      </div>

      <div class="form-group">
        <label for="profile-interesses">Interesses</label>
        <textarea id="profile-interesses" rows="3" placeholder="Interesses do aluno..."></textarea>
      </div>

      <div class="form-group">
        <label for="profile-diagnostico">Diagnostico</label>
        <input type="text" id="profile-diagnostico" maxlength="200" placeholder="Diagnostico (opcional)">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-modal-cancel" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn-modal-save">Salvar Perfil</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="alert" hidden>
  <span id="toast-icon"></span>
  <span id="toast-message"></span>
</div>

    <script src="/js/js.cookie.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/client.js"></script>
    <script src="/js/painel.js"></script>
</body>
</html>
